services:
  mysql:
    image: mysql:8.0
    container_name: palette-room-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: palette_room
      MYSQL_USER: palette
      MYSQL_PASSWORD: palette1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

